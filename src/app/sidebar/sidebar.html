<button
  class="menu-toggle"
  type="button"
  [attr.aria-expanded]="menuOpen()"
  aria-controls="portfolio-sidebar"
  [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
  (click)="toggleMenu()"
>
  <i class="bi" [class.bi-list]="!menuOpen()" [class.bi-x-lg]="menuOpen()" aria-hidden="true"></i>
</button>

@if (menuOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Cerrar menú"
    (click)="closeMenu()"
  ></button>
}

<aside
  class="sidebar"
  id="portfolio-sidebar"
  [class.is-open]="menuOpen()"
  aria-label="Barra lateral de navegación"
>
  <div class="profile">
    <a class="profile-photo-link" href="#inicio" (click)="closeMenu()" aria-label="Ir al inicio">
      <img
        class="profile-photo"
        ngSrc="assets/images/profile/mi-foto.png"
        alt="Retrato de Joshua Jhoel Chuquimia Amusquivar"
        width="373"
        height="645"
      >
    </a>
    <a class="profile-name" href="#inicio" (click)="closeMenu()">
      Joshua Jhoel Chuquimia Amusquivar
    </a>

    <div class="social-links" aria-label="Redes sociales">
      @for (social of socialLinks; track social.label) {
        <a
          class="social-link"
          [href]="social.href"
          [attr.aria-label]="social.label"
          target="_blank"
          rel="noopener noreferrer"
        >
          <i class="bi" [class]="social.icon" aria-hidden="true"></i>
        </a>
      }
    </div>
  </div>

  <nav class="navigation" aria-label="Navegación principal">
    @for (link of navigationLinks; track link.href) {
      <a class="navigation-link" [href]="link.href" (click)="closeMenu()">
        <i class="bi" [class]="link.icon" aria-hidden="true"></i>
        <span>{{ link.label }}</span>
      </a>
    }
  </nav>
</aside>
